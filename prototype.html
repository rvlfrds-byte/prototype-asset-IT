let session=JSON.parse(safeSession.getItem('assetProtoSession')||'null');let page='dashboard',query={},currentId=null,notice='',modal=null,period=30;const DAY='2026-11-24';function days(t){if(!t)return null;return Math.round((Date.parse(t+'T00:00:00')-Date.parse(DAY+'T00:00:00'))/86400000)}function format(d){if(!d)return '—';return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00'))}function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function persist(){safeLocal.setItem('assetProtoAssets',JSON.stringify(assets));safeLocal.setItem('assetProtoAudits',JSON.stringify(audits));safeLocal.setItem('assetProtoUsers',JSON.stringify(users))}function navigate(p,q={},id=null){page=p;query=q;currentId=id;notice='';modal=null;render();scrollTo(0,0)}function status(s){return ({in_use:'Digunakan',in_stock:'Stok',in_repair:'Perbaikan',retired:'Pensiun'})[s]||s}function badge(txt,c='blue'){return `<span class="pill ${c}">${esc(txt)}</span>`}function expiryTag(d){const n=days(d);if(n===null)return badge('Tidak diatur','gray');return n<0?badge(`Expired ${Math.abs(n)} hari`,'red'):n<=30?badge(`H-${n}`,'amber'):badge(`H-${n}`,'blue')}function stat(t,v,desc,icon,color,action){return `<div class="card" role="button" tabindex="0" data-go="${action}" aria-label="${esc(t)}"><div class="stat-row"><span>${t}</span><span class="stat-icon ${color}">${icon}</span></div><div class="number">${v}</div><div class="sub">${desc}  ↗</div></div>`}function header(title,desc,ey='ASSET MANAGEMENT',actions=''){return `<div class="heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}function canEdit(){return session?.role==='admin'||session?.role==='staff'}function isAdmin(){return session?.role==='admin'}function guard(){if(!session){page='login';return}if(['users','userForm','audit','auditDetail'].inclu function render(){guard();let view={dashboard,assets:listAssets,assetForm:formAsset,assetDetail:detailAsset,users:listUsers,userForm:formUser,audit:auditLog,auditDetail,denied:forbidden}[page];document.getElementById('app').innerHTML=page==='login'?login():shell(view?view():dashboard());document.querySelectorAll('[data-go]').forEach(b=>{b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.go)})});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let r=b.dataset.role;document.getElementById('loginEmail').value=r+'@asset.local';document.getElementById('loginPass').value='Admin123!';document.getElementById('loginEmail').focus()});document.querySelector('#loginForm')?.addEventListener('submit',e=>{e.preventDefault();const email=document.querySelector('#loginEmail').value.trim().toLowerCase();const u=users.find(x=>x.email===email);if(!u||document.querySelector('#loginPass').value!=='Admin123!'){alert('Akun demo tidak ditemukan atau password salah.');return}session=u;safeSession.setItem('assetProtoSession',JSON.stringify(u));navigate('dashboard')});document.querySelector('#period')?.addEventListener('change',e=>{period=Number(e.target.value);render()});document.querySelector('#assetFilters')?.addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));query={...query,...f};render()});document.querySelector('#assetForm')?.addEventListener('submit',saveAsset);document.querySelector('#userForm')?.addEventListener('submit',saveUser);document.querySelectorAll('[data-delete-asset]').forEach(b=>b.onclick=()=>confirmDelete('asset',Number(b.dataset.deleteAsset)));document.querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>confirmDelete('user',Number(b.dataset.deleteUser)));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter'&&b.getAttribute('role')==='button')go(b.dataset.go)}))}function go(x){if(x==='logout'){session=null;safeSession.removeItem('assetProtoSession');navigate('login');return}const [target,params]=x.split('?');if(params!==undefined){let q=Object.fromEntries(new URLSearchParams(params));if(!q.expiry)delete q.expiry;if(!q.type)delete q.type;navigate(target,q);return}const [t,id]=x.split(':');navigate(t,{},id||null)}function changeLog(action,kind,subject,old,next){audits.unshift({id:Date.now()+Math.floor(Math.random()*10000),date:DAY+' '+new Date().toTimeString().slice(0,5),actor:session.name,action,kind,subject,old,next})}function saveAsset(e){e.preventDefault();if(!canEdit())return navigate('denied');const f=Object.fromEntries(new FormData(e.target));if(f.wStart&&f.wEnd&&f.wEnd<f.wStart){alert('Tanggal warranty berakhir tidak boleh sebelum tanggal mulai.');return}if(f.sStart&&f.sEnd&&f.sEnd<f.sStart){alert('Tanggal subscription berakhir tidak boleh sebelum tanggal mulai.');return}let id=Number(e.target.dataset.id);if(assets.some(a=>a.code===f.code&&a.id!==id)){alert('Kode aset sudah digunakan.');return}if(e.target.dataset.edit==='yes'){const a=assets.find(x=>x.id===id);const old={};const next={};for(let k in f){if(String(a[k]||'')!==String(f[k]||'')){old[k]=a[k]||'—';next[k]=f[k]||'—'}}Object.assign(a,f);if(Object.keys(old).length)changeLog('Updated','Asset',a.name,old,next);notice='Data aset berhasil diperbarui.'}else{let a={id:Math.max(0,...assets.map(a=>a.id))+1,...f};assets.unshift(a);changeLog('Created','Asset',a.name,{}, {code:a.code,name:a.name,status:status(a.status)});notice='Aset baru berhasil ditambahkan.'}persist();const msg=notice;navigate('assets');notice=msg;render()}function saveUser(e){e.preventDefault();if(!isAdmin())return navigate('denied');let f=Object.fromEntries(new FormData(e.target)),id=Number(e.target.dataset.id);if(users.some(u=>u.email===f.email&&u.id!==id)){alert('Email telah digunakan.');return}if(e.target.dataset.edit==='yes'){let u=users.find(x=>x.id===id);let old={role:u.role,name:u.name};let next={role:f.role,name:f.name};Object.assign(u,{name:f.name,email:f.email,role:f.role});changeLog('Updated','User',u.name,old,next)}else{let u={id:Math.max(...users.map(u=>u.id))+1,name:f.name,email:f.email,role:f.role};users.push(u);changeLog('Created','User',u.name,{}, {name:u.name,role:u.role})}persist();navigate('users');notice='Pengguna berhasil disimpan.';render()}function confirmDelete(kind,id){if(kind==='asset'&&!canEdit()||kind==='user'&&!isAdmin())return;let obj=kind==='asset'?assets.find(x=>x.id===id):users.find(x=>x.id===id);if(!obj)return;let name=obj.name;let overlay=document.createElement('div');overlay.className='modal-shade';overlay.innerHTML=`<div class="modal"><div style="font-size:28px;color:#dc5069;margin-bottom:14px">⚠</div><h2>Hapus ${kind==='asset'?'Aset':'Pengguna'}?</h2><p>Anda yakin ingin menghapus <b>${esc(name)}</b>? Perubahan ini akan disimpan pada Log History dan tidak dapat dibatalkan.</p><div class="modal-footer"><button class="btn secondary" id="cancelDel">Batal</button><button class="btn danger" id="confirmDel">Hapus Sekarang</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('#cancelDel').onclick=()=>overlay.remove();overlay.querySelector('#confirmDel').onclick=()=>{if(kind==='asset'){assets=assets.filter(a=>a.id!==id)}else{users=users.filter(u=>u.id!==id)}changeLog('Deleted',kind==='asset'?'Asset':'User',name,{name:obj.name,code:obj.code||'',role:obj.role||''},{});persist();overlay.remove();navigate(kind==='asset'?'assets':'users');notice='Data berhasil dihapus; aktivitas tercatat di Log History.';render()}}render();
</script></body></html>
